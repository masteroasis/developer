name: Deploy to Cloudflare Pages

# NOTE: GitHub only runs workflows from `.github/workflows/` at the ROOT of a
# repository. While this starter lives in a subdirectory it will not run.
# It activates once the starter is moved into its own repo (see README).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Must match the Cloudflare Pages project name exactly.
          # Pushes to main become the production deploy; pull requests get
          # their own preview URL, named after the source branch.
          command: >-
            pages deploy public
            --project-name=thewaters
            --branch=${{ github.head_ref || github.ref_name }}
